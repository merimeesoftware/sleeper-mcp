name = "sleeper-mcp"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Optional agents peer; not used at runtime. Lets Wrangler resolve a dynamic import.
[alias]
ai = "./src/ai-stub.ts"

# Do not put SLEEPER_USERNAME / SLEEPER_LEAGUE_ID here — even as "".
# Empty [vars] overwrite Worker secrets of the same name on deploy.
# Set those as encrypted secrets (dashboard or `wrangler secret put`).
[vars]
SLEEPER_SEASON = "2026"

[[kv_namespaces]]
binding = "CACHE"
id = "778341e3af63486bad7ca1cc970fbd8b"
