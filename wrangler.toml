name = "sleeper-mcp"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Optional agents peer; not used at runtime. Lets Wrangler resolve a dynamic import.
[alias]
ai = "./src/ai-stub.ts"

# Identity (SLEEPER_USERNAME, SLEEPER_LEAGUE_ID) is encrypted Worker secrets only.
# Do not add them under [vars], even as "". Empty vars overwrite secrets on deploy.
# Season comes from Sleeper's NFL state, not config.

[[kv_namespaces]]
binding = "CACHE"
id = "778341e3af63486bad7ca1cc970fbd8b"
